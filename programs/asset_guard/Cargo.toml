[package]
name = "asset_guard"
version = "0.1.0"
description = "Asset-Guard 인수인계 스마트컨트랙트 — 블록체인 무결성 감사 추적 (Solana Devnet)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "asset_guard"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.31.0"